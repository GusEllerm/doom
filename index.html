<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DOOM</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stack { position: fixed; inset: 0; }
      #stack canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        cursor: crosshair;
      }
      #world { z-index: 0; pointer-events: none; }
      #overlay { z-index: 1; }
    </style>
  </head>
  <body>
    <div id="stack">
      <canvas id="world"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
