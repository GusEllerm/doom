<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM (TypeScript recreation)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 320x200 framebuffer, nearest-neighbour upscaled by CSS. */
      #game {
        width: 960px;
        height: 600px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="320" height="200"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
